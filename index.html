<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chest Analysis - Preview Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/sonic@latest/dist/teachablemachine-sonic.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; box-sizing: border-box; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        
        .nav-tabs { display: flex; justify-content: space-around; margin-bottom: 20px; background: #e8f0fe; padding: 5px; border-radius: 12px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-family: 'Kanit', sans-serif; font-size: 15px; font-weight: 600; color: #1a73e8; cursor: pointer; border-radius: 8px; width: 50%; transition: 0.3s; }
        .tab-btn.active { background: #1a73e8; color: white; }

        #status { padding: 12px; border-radius: 12px; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        .ok { background: #e6f4ea; color: #1e8e3e; border: 1px solid #34a853; }
        .err { background: #fce8e6; color: #d93025; border: 1px solid #ea4335; }

        .upload-zone { border: 2px dashed #1a73e8; padding: 40px 20px; border-radius: 15px; cursor: pointer; background: #f8fbff; margin-bottom: 20px; transition: 0.3s; }
        .upload-zone:hover { background: #e8f0fe; }
        #image-preview { width: 100%; border-radius: 12px; margin-bottom: 25px; display: none; border: 1px solid #ddd; }

        /* ปุ่มอัดเสียง */
        .audio-btn { background: #ea4335; color: white; border: none; padding: 15px 30px; font-family: 'Kanit', sans-serif; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(234,67,53,0.3); transition: 0.3s; }
        .audio-btn:hover { background: #d93025; }
        .audio-btn.listening { background: #34a853; animation: pulse 1.5s infinite; box-shadow: 0 4px 15px rgba(52,168,83,0.3); }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .main-bar-container { margin-bottom: 15px; padding: 15px; border-radius: 12px; background: #fff; border: 1px solid #eee; text-align: left; }
        .bar-info { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; font-size: 16px; }
        .bar-outer { background: #eee; border-radius: 10px; height: 16px; width: 100%; overflow: hidden; }
        .bar-inner { height: 100%; transition: width 0.3s ease; }

        .sub-disease-list { margin-left: 20px; border-left: 3px solid #dee2e6; padding-left: 15px; margin-top: 15px; }
        .sub-item { margin-bottom: 12px; }
        .sub-info { display: flex; justify-content: space-between; font-size: 13px; color: #444; margin-bottom: 4px; }
        .sub-bar-outer { background: #f0f0f0; border-radius: 5px; height: 8px; width: 100%; overflow: hidden; }

        .disclaimer { margin-top: 30px; padding: 15px; background: #fff4e5; border-radius: 10px; font-size: 12px; text-align: left; border-left: 5px solid #ff9800; color: #663c00; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔍 AI วิเคราะห์โรคปอด</h2>
    
    <div class="nav-tabs">
        <button id="tab-img" class="tab-btn active" onclick="switchPage('image')">📸 ตรวจจากภาพ</button>
        <button id="tab-audio" class="tab-btn" onclick="switchPage('audio')">🎵 ตรวจจากเสียง</button>
    </div>

    <div id="status" class="status err">⏳ กำลังโหลดระบบ AI...</div>

    <div id="image-section">
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="predictImage(event)">
        <div class="upload-zone" onclick="document.getElementById('file-input').click()">
            <strong>📁 คลิกเพื่อเลือกรูปภาพ X-ray</strong>
            <p style="font-size: 12px; color: #666; margin: 5px 0 0 0;">
    (คัดกรอง: ปกติ, วัณโรค, ปอดบวม, ลมในช่องอก, ถุงลมโป่งพอง, พังผืดในปอด, Covid-19)
</p>
        </div>
        <img id="image-preview">
    </div>

    <div id="audio-section" style="display: none;">
        <button id="listen-btn" class="audio-btn" onclick="toggleListeningDummy()">🎤 เริ่มฟังเสียง </button>
    </div>

    <div id="result-area"></div>

    <div class="disclaimer">
        <b>⚠️ คำเตือน:</b> เว็บไซต์นี้จัดทำเพื่อการศึกษาเท่านั้น ข้อมูลจาก AI ไม่สามารถใช้แทนการวินิจฉัยของแพทย์ได้ หากมีอาการผิดปกติกรุณาพบแพทย์ทันที
    </div>
</div>

<script>
    const IMAGE_URL = "./"; 
    let imageModel;

    async function init() {
        try {
            const t = new Date().getTime();
            
            // โหลดเฉพาะโมเดลภาพเดิมของคุณก่อน
            imageModel = await tmImage.load(IMAGE_URL + "model.json?v="+t, IMAGE_URL + "metadata.json?v="+t);
            
            document.getElementById("status").innerText = "● Model พร้อมใช้งาน ";
            document.getElementById("status").className = "status ok";
        } catch (e) {
            document.getElementById("status").innerText = "● Model ยังไม่พร้อมใช้งาน (กรุณาใส่ไฟล์โมเดลในโฟลเดอร์)";
        }
    }

    // ฟังก์ชันสลับหน้าจอ (กดดูหน้าเสียงเปล่าๆ ได้เลย ไม่ติด Error)
    function switchPage(page) {
        document.getElementById('result-area').innerHTML = ""; 
        
        if (page === 'image') {
            document.getElementById('tab-img').classList.add('active');
            document.getElementById('tab-audio').classList.remove('active');
            document.getElementById('image-section').style.display = 'block';
            document.getElementById('audio-section').style.display = 'none';
        } else {
            document.getElementById('tab-img').classList.remove('active');
            document.getElementById('tab-audio').classList.add('active');
            document.getElementById('image-section').style.display = 'none';
            document.getElementById('audio-section').style.display = 'block';
            document.getElementById('image-preview').style.display = 'none';
        }
    }

    // ฟังก์ชันทำนายภาพเดิม
    async function predictImage(event) {
        if(!imageModel) {
            alert("กรุณาใส่ไฟล์โมเดลภาพในโฟลเดอร์ก่อนครับ");
            return;
        }
        const file = event.target.files[0];
        if (!file) return;
        const img = document.getElementById("image-preview");
        img.src = window.URL.createObjectURL(file);
        img.style.display = "block";
        img.onload = async () => {
            const prediction = await imageModel.predict(img);
            renderResults(prediction);
        };
    }

    // ฟังก์ชันปุ่มกดเล่นหน้าเสียง (แบบจำลอง เพื่อให้อาจารย์เห็นภาพสไตล์แถบสถานะ)
    function toggleListeningDummy() {
        const btn = document.getElementById('listen-btn');
        if (btn.classList.contains('listening')) {
            btn.innerText = "🎤 เริ่มฟังเสียง";
            btn.classList.remove('listening');
            document.getElementById('result-area').innerHTML = "";
        } else {
            btn.innerText = "🛑 กำลังฟังเสียง... คลิกอีกครั้งเพื่อหยุด";
            btn.classList.add('listening');
            
            // สุ่มค่าหลอกๆ เพื่อโชว์หน้าตา UI สวยๆ ให้เห็นแถบเปอร์เซ็นต์
            const dummyResults = [
                { className: "Normal (ปกติ)", probability: 0.85 },
                { className: "Coughing (เสียงไอผิดปกติ)", probability: 0.15 }
            ];
            renderResults(dummyResults);
        }
    }

    // ฟังก์ชันแสดงผลแถบเปอร์เซ็นต์
 function renderResults(results) {
        const area = document.getElementById("result-area");
        area.innerHTML = "";

        let normalScore = 0;
        let nonLungScore = 0;
        let diseases = [];
        let totalAbnormal = 0;

        results.forEach(res => {
            const classNameLower = res.className.toLowerCase();
            
            // ตรวจสอบชื่อคลาสว่าเป็น "ไม่ใช่ปอด" หรือไม่
            if (classNameLower.includes("non-lung") || classNameLower.includes("ไม่ใช่ปอด")) {
                nonLungScore = res.probability;
            } 
            // ตรวจสอบชื่อคลาสว่าเป็น "ปกติ" หรือไม่
            else if (classNameLower.includes("normal") || classNameLower.includes("ปกติ")) {
                normalScore = res.probability;
            } 
            // คลาสโรคอื่นๆ ทั้งหมด (วัณโรค, ปอดบวม, ลมในช่องอก, ถุงลมโป่งพอง, พังผืด, Covid)
            else {
                diseases.push(res);
                totalAbnormal += res.probability;
            }
        });

        // ถ้า AI มั่นใจว่าเป็นภาพอื่นที่ไม่ใช่ปอด (มากกว่า 50%) ให้ขึ้นเตือนแถบสีเหลือง
        if (nonLungScore > 0.5) {
            const nlPct = (nonLungScore * 100).toFixed(2);
            area.innerHTML += `
                <div class="main-bar-container" style="border-color: #ffeeba; background: #fff3cd;">
                    <div class="bar-info" style="color: #856404;"><span>⚠️ ตรวจพบ: ภาพนี้ไม่ใช่ภาพเอกซเรย์ปอด</span><span>${nlPct}%</span></div>
                    <div class="bar-outer"><div class="bar-inner" style="width: ${nlPct}%; background: #ffc107;"></div></div>
                    <p style="font-size: 13px; color: #856404; margin: 10px 0 0 0;">* กรุณาอัปโหลดรูปภาพทรวงอก (Chest X-ray) ที่ถูกต้อง</p>
                </div>
            `;
            return; 
        }

        // แสดงผลฝั่งปกติ
        const nPct = (normalScore * 100).toFixed(2);
        area.innerHTML += `
            <div class="main-bar-container">
                <div class="bar-info"><span>✅ ผลตรวจปกติ / ปลอดภัย</span><span>${nPct}%</span></div>
                <div class="bar-outer"><div class="bar-inner" style="width: ${nPct}%; background: #28a745;"></div></div>
            </div>
        `;

        // แสดงผลฝั่งพบความเสี่ยงโรค
        if(diseases.length > 0) {
            const abPct = (totalAbnormal * 100).toFixed(2);
            let abHtml = `
                <div class="main-bar-container" style="border-color: #f5c6cb;">
                    <div class="bar-info" style="color: #d93025;"><span>❌ พบความเสี่ยงผิดปกติ</span><span>${abPct}%</span></div>
                    <div class="bar-outer"><div class="bar-inner" style="width: ${abPct}%; background: #d93025;"></div></div>
                    <div class="sub-disease-list">
                        <p style="font-size: 13px; font-weight: bold; color: #666; margin: 0 0 10px 0;">รายละเอียดจำแนกโรค:</p>
            `;

            diseases.sort((a, b) => b.probability - a.probability);
            diseases.forEach(d => {
                const dPct = (d.probability * 100).toFixed(2);
                abHtml += `
                    <div class="sub-item">
                        <div class="sub-info"><span>• ${d.className}</span><span>${dPct}%</span></div>
                        <div class="sub-bar-outer"><div style="width:${dPct}%; background:#6c757d; height:100%;"></div></div>
                    </div>
                `;
            });

            abHtml += `</div></div>`;
            area.innerHTML += abHtml;
        }
    }
    init();
</script>
</body>
</html>
